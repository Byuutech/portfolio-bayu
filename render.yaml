services:
  - type: web
    name: portfolio-bayu
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class gthread --threads 100 --workers 1 --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: CHAT_OPERATOR_USERNAME
        sync: false
      - key: CHAT_OPERATOR_PASSWORD
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "1"
